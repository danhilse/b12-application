name: Submit B12 Application

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      - main  # Or trigger on push to main branch

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Submit application to B12
        env:
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_RESUME_LINK: ${{ secrets.APPLICANT_RESUME_LINK }}
          APPLICANT_REPOSITORY_LINK: ${{ secrets.APPLICANT_REPOSITORY_LINK }}
          # GITHUB_* variables are automatically available
        run: python submit_application.py
